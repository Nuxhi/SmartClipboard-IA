<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/root.css">
    <title>menu</title>
</head>
<body>
    <nav id="main-navbar">
        <button onclick="showSection('cloud')">Cloud</button>
        <button onclick="showSection('local')">Local</button>
        <button onclick="showSection('setting')">Settings</button>
    </nav>
    
    <div class="main-container">
            
            <div class="container cloud hidden" id="cloud">

                <ul>
                    <li>Model personnalisé</li>
                    <li>CLOUD 1</li>
                    <li>CLOUD 2</li>
                </ul>

            </div>
            
            
            <div class="container local hidden" id="local">

                <ul>
                    <li>Model personnalisé</li>
                    <li>Mistral</li>
                    <li>LLAMA</li>
                </ul>

            </div>

            <div class="container setting hidden" id="setting">

                <ul>
                    <li>modification du prompt</li>
                    <li>Réglage des parametres</li>
                    <li>Autre</li>
                </ul>
            </div>
            
    </div>
    
    <script>
        function showSection(sectionId) {
            // Masquer toutes les sections
            document.getElementById('cloud').classList.add('hidden');
            document.getElementById('local').classList.add('hidden');
            document.getElementById('setting').classList.add('hidden');
            
            // Afficher la section demandée
            document.getElementById(sectionId).classList.remove('hidden');
            
            // Mettre à jour le bouton actif
            document.querySelectorAll('#main-navbar button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
